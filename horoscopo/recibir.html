<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datos Recibidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4 text-center">
                    <h3 class="mb-4">Datos recibidos</h3>
                    <div class="text-start bg-light p-3 rounded">
                        <p><strong>Nombre:</strong> <span id="verNombre"></span></p>
                        <p><strong>Correo:</strong> <span id="verCorreo"></span></p>
                        <p><strong>Fecha de nacimiento:</strong> <span id="verFecha"></span></p>
                    </div>
                    <a href="formulario.html" class="btn btn-secondary mt-3 w-100">Regresar</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('verNombre').textContent = params.get('nombre');
    document.getElementById('verCorreo').textContent = params.get('correo');
    document.getElementById('verFecha').textContent = params.get('fecha');
</script>
</body>
</html>
